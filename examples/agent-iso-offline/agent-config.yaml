# Agent config for the SNO lab test. Fake MAC/IPs (no host is ever booted).
apiVersion: v1alpha1
kind: AgentConfig
metadata:
  name: agent-sno
rendezvousIP: 192.168.111.80
hosts:
- hostname: master0
  role: master
  interfaces:
  - name: eno1
    macAddress: 52:54:00:aa:bb:01
  networkConfig:
    interfaces:
    - name: eno1
      type: ethernet
      state: up
      mac-address: 52:54:00:aa:bb:01
      ipv4:
        enabled: true
        dhcp: false
        address:
        - ip: 192.168.111.80
          prefix-length: 24
    dns-resolver:
      config:
        server:
        - 192.168.111.1
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 192.168.111.1
        next-hop-interface: eno1
        table-id: 254
