kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    channels:
      - name: candidate-5.0
        type: ocp
        minVersion: 5.0.0
        maxVersion: 5.0.0
        shortestPath: true
    graph: true
  operators:
