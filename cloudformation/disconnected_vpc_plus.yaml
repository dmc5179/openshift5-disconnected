AWSTemplateFormatVersion: 2010-09-09
Description: Simulated disconnected VPC (1-3 AZs) with a Squid egress filter, bastion and mirror registry, for OpenShift 5

# Copied from openshift4-disconnected/cloudformation/disconnected_vpc/disconnected_vpc_plus.yaml
# (sha256 6bfcc1a1...) on 2026-11-03 and adapted for OpenShift 5. Changes are tracked in AGENTS.md (CF-*).
#
# Topology:
#   public subnet  - Squid NAT/egress-filter instance, bastion ("connected side"), internet gateway
#   private subnet - mirror registry and the OpenShift cluster ("disconnected side"); its only egress is
#                    the Squid instance, which allows the domains in /etc/squid/whitelist.txt
#
# The Outputs section is the interface the scripts in scripts/ read. Keep the output names stable.

Parameters:

  VpcCidr:
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-4]))$
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-24.
    Default: 10.0.0.0/16
    Description: CIDR block for VPC.
    Type: String

  AvailabilityZoneCount:
    ConstraintDescription: "The number of availability zones. (Min: 1, Max: 3)"
    MinValue: 1
    MaxValue: 3
    Default: 1
    Description: "How many AZs to create VPC subnets for. (Min: 1, Max: 3)"
    Type: Number

  SubnetBits:
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/19-27.
    MinValue: 5
    MaxValue: 13
    Default: 12
    Description: "Size of each subnet to create within the availability zones. (Min: 5 = /27, Max: 13 = /19)"
    Type: Number

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of RSA key for EC2 access for testing and troubleshooting.

  OpenShiftVersion:
    Default: "5.0.0"
    Description: >-
      OpenShift version whose oc and openshift-install are downloaded from
      mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/<version>/ (5.x builds are published there too).
    Type: String

  ClientRhelBuild:
    Type: String
    Default: rhel9
    AllowedValues: [rhel9, rhel10]
    Description: >-
      RHEL build of oc/kubectl and ccoctl to install (openshift-client-linux-amd64-<build>-<version>,
      ccoctl-linux-<build>-<version>). Only rhel8/rhel9 builds are published as of 2026-11; rhel10 is
      accepted for when they ship (AGENTS.md B-2). openshift-install is rhel9-only.

  OcMirrorUrl:
    Default: "https://mirror.openshift.com/pub/cgw/oc-mirror/latest/oc-mirror-rhel9-linux-amd64.tar.gz"
    Description: >-
      oc-mirror v2 tarball. From OpenShift 5.0 oc-mirror is no longer published per release under
      clients/ocp/<version>/ (that path returns 404); it ships asynchronously under pub/cgw/oc-mirror/.
    Type: String

  PullSecretJson:
    Description: >-
      OpenShift pull secret JSON. NoEcho hides it from the console and describe-stacks, but it is still
      written into the bastion's user data, which anyone with ec2:DescribeInstanceAttribute can read (CF-9).
    Type: String
    NoEcho: true
    Default: "{}"

  NATInstanceType:
    Type: String
    Default: t3.large
    Description: Instance type to use to launch the NAT instance.
    AllowedValues:
    - t3.nano
    - t3.micro
    - t3.small
    - t3.medium
    - t3.large
    - m4.large
    - m4.xlarge
    - m4.2xlarge
    - m5.large
    - m5.xlarge
    - m5.2xlarge
    - c4.large
    - c4.xlarge
    - c5.large
    - c5.xlarge

  BastionInstanceType:
    Type: String
    Default: m6i.2xlarge
    Description: >-
      Instance type for the bastion. It runs oc-mirror and openshift-install (with its local control plane)
      at the same time; a t3.large (2 vCPU, 8 GB, burstable) was too small.

  BastionAmiId:
    Type: String
    Default: ""
    Description: >-
      AMI for the bastion. Blank = the RHEL 9 AMI in RHELMap. scripts/10-deploy-vpc.sh passes the newest
      Red Hat RHEL 9 or RHEL 10 AMI for the region (BASTION_RHEL_VERSION). The bastion's RHEL major version
      is chosen at creation; it is not upgraded in place.

  NodeAmiId:
    Type: String
    Default: ""
    Description: >-
      AMI for the Squid (NAT) and registry nodes. Blank = the RHEL 9 AMI in RHELMap (RHEL 9.5,
      Dec 2024, four regions only). scripts/10-deploy-vpc.sh passes the newest Red Hat RHEL 9 AMI
      for the region (CF-13).

  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
    Description: >-
      CIDR allowed to SSH to the bastion. scripts/10-deploy-vpc.sh sets it to the caller's public IP /32.

  RegistryInstanceType:
    Type: String
    Default: m6i.xlarge
    Description: >-
      Instance type for the registry node (mirror-registry / Quay, and an install host). A t3.large
      (burstable) struggled with 23-45 GB mirror pushes.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: "Network Configuration"
      Parameters:
      - VpcCidr
      - SubnetBits
    - Label:
        default: "Availability Zones"
      Parameters:
      - AvailabilityZoneCount
    ParameterLabels:
      AvailabilityZoneCount:
        default: "Availability Zone Count"
      VpcCidr:
        default: "VPC CIDR"
      SubnetBits:
        default: "Bits Per Subnet"

Mappings:
  RHELMap:
    us-east-1:
      HVM64: ami-0b4466ff0aec45222
    us-east-2:
      HVM64: ami-002acc74c401fa86b # RHEL 9.5
    us-west-1:
      HVM64: ami-02bfa5a117cd76b94
    eu-west-1:
      HVM64: ami-01810eb03ac7f790c


Conditions:
  HasBastionAmi: !Not [!Equals ["", !Ref BastionAmiId]]
  HasNodeAmi: !Not [!Equals ["", !Ref NodeAmiId]]
  DoAz3: !Equals [3, !Ref AvailabilityZoneCount]
  DoAz2: !Or [!Equals [2, !Ref AvailabilityZoneCount], Condition: DoAz3]

Resources:

  VPC:
    Type: "AWS::EC2::VPC"
    Properties:
      EnableDnsSupport: "true"
      EnableDnsHostnames: "true"
      CidrBlock: !Ref VpcCidr

#####################################################################
# Public Subnets

  PublicSubnet:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 6, !Ref SubnetBits]]
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value: !Sub 'Public Subnet - ${AWS::StackName}'
      # Load balancer subnet discovery by the AWS cloud controller. Not an ownership tag. Without it,
      # LoadBalancer Services fail with "could not find any suitable subnets for creating the ELB".
      - Key: kubernetes.io/role/elb
        Value: "1"
      AvailabilityZone: !Select
      - 0
      - Fn::GetAZs: !Ref "AWS::Region"

  PublicSubnet2:
    Type: "AWS::EC2::Subnet"
    Condition: DoAz2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 6, !Ref SubnetBits]]
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value: !Sub 'Public Subnet 2 - ${AWS::StackName}'
      # Load balancer subnet discovery by the AWS cloud controller. Not an ownership tag. Without it,
      # LoadBalancer Services fail with "could not find any suitable subnets for creating the ELB".
      - Key: kubernetes.io/role/elb
        Value: "1"
      AvailabilityZone: !Select
      - 1
      - Fn::GetAZs: !Ref "AWS::Region"

  PublicSubnet3:
    Type: "AWS::EC2::Subnet"
    Condition: DoAz3
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 6, !Ref SubnetBits]]
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value: !Sub 'Public Subnet 3 - ${AWS::StackName}'
      # Load balancer subnet discovery by the AWS cloud controller. Not an ownership tag. Without it,
      # LoadBalancer Services fail with "could not find any suitable subnets for creating the ELB".
      - Key: kubernetes.io/role/elb
        Value: "1"
      AvailabilityZone: !Select
      - 2
      - Fn::GetAZs: !Ref "AWS::Region"

  InternetGateway:
    Type: "AWS::EC2::InternetGateway"

  GatewayToInternet:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: "AWS::EC2::Route"
    DependsOn: GatewayToInternet
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation2:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Condition: DoAz2
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation3:
    Condition: DoAz3
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

####################################################################3
# Private Subnets

  PrivateSubnet:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 6, !Ref SubnetBits]]
      Tags:
      - Key: Name
        Value: !Sub 'Private Subnet - ${AWS::StackName}'
      # Load balancer subnet discovery by the AWS cloud controller. Not an ownership tag. Without it,
      # LoadBalancer Services fail with "could not find any suitable subnets for creating the ELB".
      - Key: kubernetes.io/role/internal-elb
        Value: "1"
      AvailabilityZone: !Select
      - 0
      - Fn::GetAZs: !Ref "AWS::Region"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
      - Key: Name
        Value: !Sub 'Private Route Table - ${AWS::StackName}'

  PrivateRouteTableSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetNATRoute:
    Type: AWS::EC2::Route
    Properties:
       RouteTableId:
         Ref: PrivateRouteTable
       DestinationCidrBlock: 0.0.0.0/0
       InstanceId: !Ref NATInstance

  PrivateSubnet2:
    Type: "AWS::EC2::Subnet"
    Condition: DoAz2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 6, !Ref SubnetBits]]
      Tags:
      - Key: Name
        Value: !Sub 'Private Subnet 2 - ${AWS::StackName}'
      # Load balancer subnet discovery by the AWS cloud controller. Not an ownership tag. Without it,
      # LoadBalancer Services fail with "could not find any suitable subnets for creating the ELB".
      - Key: kubernetes.io/role/internal-elb
        Value: "1"
      AvailabilityZone: !Select
      - 1
      - Fn::GetAZs: !Ref "AWS::Region"

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Condition: DoAz2
    Properties:
      VpcId: !Ref VPC
      Tags:
      - Key: Name
        Value: !Sub 'Private Route Table 2 - ${AWS::StackName}'

  PrivateRouteTableSubnetAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: DoAz2
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  PrivateSubnetNATRoute2:
    Type: AWS::EC2::Route
    Condition: DoAz2
    Properties:
       RouteTableId:
         Ref: PrivateRouteTable2
       DestinationCidrBlock: 0.0.0.0/0
       InstanceId: !Ref NATInstance

  PrivateSubnet3:
    Type: "AWS::EC2::Subnet"
    Condition: DoAz3
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 6, !Ref SubnetBits]]
      Tags:
      - Key: Name
        Value: !Sub 'Private Subnet 3 - ${AWS::StackName}'
      # Load balancer subnet discovery by the AWS cloud controller. Not an ownership tag. Without it,
      # LoadBalancer Services fail with "could not find any suitable subnets for creating the ELB".
      - Key: kubernetes.io/role/internal-elb
        Value: "1"
      AvailabilityZone: !Select
      - 2
      - Fn::GetAZs: !Ref "AWS::Region"

  PrivateRouteTable3:
    Type: AWS::EC2::RouteTable
    Condition: DoAz3
    Properties:
      VpcId: !Ref VPC
      Tags:
      - Key: Name
        Value: !Sub 'Private Route Table 3 - ${AWS::StackName}'

  PrivateRouteTableSubnetAssociation3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: DoAz3
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable3

  PrivateSubnetNATRoute3:
    Type: AWS::EC2::Route
    Condition: DoAz3
    Properties:
       RouteTableId:
         Ref: PrivateRouteTable3
       DestinationCidrBlock: 0.0.0.0/0
       InstanceId: !Ref NATInstance

##############################################################################
#
# NAT Instance
########

  # CF-16: require IMDSv2 (session tokens) on every instance; many GovCloud accounts
  # enforce it. Hop limit 2 so containers on the hosts can still reach IMDS.
  ImdsV2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2

  NATInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: /
      # CF-11: AmazonEC2RoleforSSM is deprecated; partition-aware ARNs for GovCloud.
      ManagedPolicyArns:
      - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy"
      Policies:
      - PolicyName: root
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
#          - Effect: Allow
#            Action:
#            - s3:GetObject
#            - s3:ListObject
#            Resource: !Sub '${S3Bucket.Arn}*'
          - Effect: Allow
            Action:
            - ec2:ModifyInstanceAttribute
            Resource: '*'
          - Effect: Allow
            Action: cloudformation:SignalResource
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  NATInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref NATInstanceRole
      Path: /

  NATInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows HTTP and HTTPS from private instances to NAT instances
      SecurityGroupIngress:
      - CidrIp: !Ref VpcCidr
        FromPort: 22
        ToPort: 22
        IpProtocol: tcp
      - CidrIp: !Ref VpcCidr
        FromPort: 80
        ToPort: 80
        IpProtocol: TCP
      - CidrIp: !Ref VpcCidr
        FromPort: 443
        ToPort: 443
        IpProtocol: TCP
      Tags:
      - Key: Name
        Value: !Sub 'NAT Instance SG - ${AWS::StackName}'
      VpcId: !Ref VPC

  NATInstance:
    Type: AWS::EC2::Instance
    # Not CREATE_COMPLETE until Squid runs and the interception rules are loaded: the
    # registry node needs working egress for dnf. Without this a fast bastion let the
    # registry start while this node was still in dnf update (2026-11-04).
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT45M
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref ImdsV2LaunchTemplate
        Version: !GetAtt ImdsV2LaunchTemplate.LatestVersionNumber
      ImageId: !If [HasNodeAmi, !Ref NodeAmiId, !FindInMap [RHELMap, !Ref "AWS::Region", HVM64]]
      InstanceType: !Ref NATInstanceType
      IamInstanceProfile: !Ref NATInstanceProfile
      KeyName: !Ref KeyName
      Tags:
      - Key: Name
        Value: !Sub 'NAT Instance - ${AWS::StackName}'
      NetworkInterfaces:
      - AssociatePublicIpAddress: "true"
        DeviceIndex: "0"
        GroupSet:
        - !Ref NATInstanceSG
        SubnetId: !Ref PublicSubnet
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash -xe
            # Redirect the user-data output to the console logs
            exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

            # Full update, not --security: a security-only update pulled the RHEL 9.8 kernel and
            # systemd but left the RHEL 9.5 SELinux policy, which then denies systemd's BPF device
            # filter after a reboot and breaks every container (CF-22).
            dnf update -y
            # fapolicyd breaks mirror-registry and other tooling; keep it off for now (AGENTS.md B-5).
            if rpm -q fapolicyd >/dev/null 2>&1; then
              systemctl disable --now fapolicyd || true
              systemctl mask fapolicyd || true
            fi
            # firewalld is not used here: the interception rules below are managed by iptables-services,
            # and firewalld.service conflicts with iptables.service (CF-7).
            yum install -y unzip vim wget
            systemctl disable --now firewalld 2>/dev/null || true

            # Trust the RHUI certs
            cp /etc/pki/rhui/cdn.redhat.com-chain.crt /etc/pki/ca-trust/source/anchors/cdn.redhat.com-chain.crt
            update-ca-trust extract
            update-ca-trust

            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            ./aws/install

            # Disable source / destination check. It cannot be disabled from the launch configuration
            region=${AWS::Region}
            imds_token=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            instanceid=$(curl -s -H "X-aws-ec2-metadata-token: $imds_token" http://169.254.169.254/latest/meta-data/instance-id)
            /usr/local/bin/aws ec2 modify-instance-attribute --no-source-dest-check --instance-id $instanceid --region $region

            # Install Squid, and iptables-nft + iptables-services so the interception rules can be
            # persisted (CF-7). iptables is not guaranteed to be on a minimal RHEL 9 image.
            yum install -y squid net-tools iptables-nft iptables-services

            cp -a /etc/squid /etc/squid_orig

            # Create a SSL certificate for the SslBump Squid module. Traffic is only peeked and spliced
            # (never decrypted), but https_port ssl-bump still needs a certificate.
            mkdir /etc/squid/ssl
            pushd /etc/squid/ssl
            openssl genrsa -out squid.key 4096
            openssl req -new -key squid.key -out squid.csr -subj "/C=US/ST=VA/L=squid/O=squid/CN=squid"
            openssl x509 -req -days 3650 -in squid.csr -signkey squid.key -out squid.crt
            cat squid.key squid.crt > squid.pem
            chown -R root:squid /etc/squid/ssl
            chmod 750 /etc/squid/ssl
            chmod 640 /etc/squid/ssl/*
            popd

            echo '.amazonaws.com' > /etc/squid/whitelist.txt
            echo '.cloudfront.net' >> /etc/squid/whitelist.txt
            echo '.ce.redhat.com' >> /etc/squid/whitelist.txt
            echo '.opentlc.com' >> /etc/squid/whitelist.txt

            cat > /etc/squid/squid.conf << 'EOF'

            visible_hostname squid
            cache deny all

            # Log format and rotation. The built-in "squid" format cannot be redefined, so use our own
            # name; it adds the TLS SNI (%ssl::>sni) after the URL. %>a is the client IP (CF-8).
            logformat egress %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %ssl::>sni %Sh/%<a %mt
            access_log daemon:/var/log/squid/access.log logformat=egress
            logfile_rotate 10
            debug_options rotate=10

            # Ports:
            #   3128 explicit proxy (HTTP and CONNECT). Not opened by the security group today.
            #   3129 intercepted HTTP  (iptables REDIRECT from port 80)
            #   3130 intercepted HTTPS (iptables REDIRECT from port 443), peeked for SNI, never decrypted
            http_port 3128 name=explicit
            http_port 3129 intercept name=http_intercept
            https_port 3130 cert=/etc/squid/ssl/squid.pem ssl-bump intercept name=https_intercept
            sslcrtd_program /usr/lib64/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB

            acl SSL_port port 443
            acl CONNECT method CONNECT
            acl intercepted_https myportname https_intercept
            acl instance_metadata dst 169.254.169.254
            acl allowed_http_sites dstdomain "/etc/squid/whitelist.txt"
            acl allowed_https_sites ssl::server_name "/etc/squid/whitelist.txt"
            acl step1 at_step SslBump1
            acl step2 at_step SslBump2
            acl step3 at_step SslBump3

            # Deny requests to proxy instance metadata. Must stay ahead of every allow rule.
            http_access deny instance_metadata

            # Explicit proxy: CONNECT only to port 443 (CF-6).
            http_access deny CONNECT !SSL_port

            # Intercepted HTTPS: at this point Squid only knows the destination IP (a "fake" CONNECT),
            # so allow it here and filter on the SNI with the ssl_bump rules below. This used to be
            # "http_access allow SSL_port", which also let explicit CONNECTs on 3128 reach any
            # host:443 (CF-6). It is now limited to the intercept port.
            http_access allow intercepted_https

            # HTTP (explicit or intercepted) and explicit CONNECT: allowlisted domains only.
            http_access allow allowed_http_sites

            http_access deny all

            # Filter intercepted HTTPS on the SNI against the allowlist: peek, then splice the allowed
            # ones and terminate the rest.
            ssl_bump peek step1 all
            ssl_bump peek step2 allowed_https_sites
            ssl_bump splice step3 allowed_https_sites
            ssl_bump terminate step2 all

            EOF

            # The certificate DB must belong to the squid user, which runs the certgen helpers (CF-8).
            rm -rf /var/spool/squid/ssl_db
            /usr/lib64/squid/security_file_certgen -c -s /var/spool/squid/ssl_db -M 4MB
            chown -R squid:squid /var/spool/squid/ssl_db
            restorecon -R /var/spool/squid /etc/squid || true

            # Validate the configuration before starting; -e makes a parse error fail the user data (CF-8).
            /usr/sbin/squid -k parse
            systemctl enable --now squid

            sleep 5

            # Redirect ports 80/443 arriving from the private subnets to Squid's intercept ports, and
            # persist the rules with iptables-services so they survive a reboot (CF-7). Forwarding is
            # off (no ip_forward), so traffic that is not redirected to Squid cannot leave; FORWARD DROP
            # makes that explicit. The source/dest check is disabled above so the private route
            # table can point at this instance.
            cat > /etc/sysconfig/iptables << 'EOF'
            *nat
            :PREROUTING ACCEPT [0:0]
            :INPUT ACCEPT [0:0]
            :OUTPUT ACCEPT [0:0]
            :POSTROUTING ACCEPT [0:0]
            -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-ports 3129
            -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-ports 3130
            COMMIT
            *filter
            :INPUT ACCEPT [0:0]
            :FORWARD DROP [0:0]
            :OUTPUT ACCEPT [0:0]
            COMMIT
            EOF
            chmod 600 /etc/sysconfig/iptables
            restorecon /etc/sysconfig/iptables || true
            systemctl enable --now iptables
            iptables -t nat -S PREROUTING

            # Tell CloudFormation whether egress filtering is up (see CreationPolicy).
            if systemctl is-active --quiet squid && iptables -t nat -S PREROUTING | grep -q 'REDIRECT --to-ports 3130'; then
              nat_status=SUCCESS
            else
              nat_status=FAILURE
            fi
            /usr/local/bin/aws cloudformation signal-resource --region ${AWS::Region} --stack-name ${AWS::StackName} \
              --logical-resource-id NATInstance --unique-id "$instanceid" --status $nat_status


# End Nat Instance
############################################################################

  S3Bucket:
    Type: AWS::S3::Bucket

  HelperIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: "Allow"
          Principal:
            Service:
            - "ec2.amazonaws.com"
          Action:
          - "sts:AssumeRole"
      Path: "/"
      Policies:
      - PolicyName: !Join ["-", ["helper", "policy"]]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Effect: "Allow"
            Action: "ec2:Describe*"
            Resource: "*"
          # CF-11: only the staging bucket, only what the user data uses (aws s3 cp/rm).
          - Effect: "Allow"
            Action: "s3:ListBucket"
            Resource: !GetAtt S3Bucket.Arn
          - Effect: "Allow"
            Action: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
            Resource: !Sub "${S3Bucket.Arn}/*"

  HelperInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      Path: "/"
      Roles:
      - Ref: "HelperIamRole"

  HelperInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows SSH connections to the bastion node
      SecurityGroupIngress:
      - CidrIp: !Ref AllowedSshCidr
        FromPort: 22
        ToPort: 22
        IpProtocol: tcp
      Tags:
      - Key: Name
        Value: !Sub 'Bastion SG - ${AWS::StackName}'
      VpcId: !Ref VPC

  HelperInstanceWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
    Properties: {}

  HelperInstanceWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties:
      Handle: !Ref HelperInstanceWaitHandle
      Timeout: 4500

  HelperInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref ImdsV2LaunchTemplate
        Version: !GetAtt ImdsV2LaunchTemplate.LatestVersionNumber
      ImageId: !If [HasBastionAmi, !Ref BastionAmiId, !FindInMap [RHELMap, !Ref "AWS::Region", HVM64]]
      IamInstanceProfile: !Ref HelperInstanceProfile
      InstanceType: !Ref BastionInstanceType
      KeyName: !Ref KeyName
      BlockDeviceMappings: 
      - DeviceName: "/dev/sda1"
        Ebs: 
          VolumeType: "gp3"
          DeleteOnTermination: "true"
          VolumeSize: "150"
      Tags:
      - Key: Name
        Value: !Sub 'Bastion Node - ${AWS::StackName}'
      NetworkInterfaces:
      - AssociatePublicIpAddress: "true"
        DeviceIndex: "0"
        GroupSet:
        - !Ref HelperInstanceSG
        SubnetId: !Ref "PublicSubnet"
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -x

            # Report the result to HelperInstanceWaitCondition. The registry node waits on it, so a
            # failed download must fail the stack instead of signalling SUCCESS (CF-14).
            signal() {
              curl -sS -X PUT -H 'Content-Type:' --data-binary \
                "{\"Status\" : \"$1\",\"Reason\" : \"$2\",\"UniqueId\" : \"ID1234\",\"Data\" : \"$2\"}" \
                "${signal_url}"
            }
            fail() {
              echo "FATAL: $*"
              signal FAILURE "Bastion user data failed: $*"
              exit 1
            }

            # Full update, not --security (CF-22: mixed-release SELinux policy breaks podman).
            dnf update -y
            # fapolicyd breaks mirror-registry and other tooling; keep it off for now (AGENTS.md B-5).
            if rpm -q fapolicyd >/dev/null 2>&1; then
              systemctl disable --now fapolicyd || true
              systemctl mask fapolicyd || true
            fi

            # DNF install loop due to slow uptime for NAT gateway
            MAX_ATTEMPTS=10
            attempt_num=1
            until [ $attempt_num -gt $MAX_ATTEMPTS ] || \
                  sudo dnf install -y wget vim podman unzip jq tmux net-tools &> /dev/null; do
                
                echo "Attempt $attempt_num failed. Trying again in 10 seconds..."
                sleep 10
                ((attempt_num++))
            done
            [ $attempt_num -le $MAX_ATTEMPTS ] || fail "dnf install of the base packages"

            cd /tmp

            region=${AWS::Region}

            # Mode 600 before the secret is written (was world-readable, CF-9).
            ( umask 077
              echo '${pull_secret}' > /tmp/pull-secret.json
              echo '${pull_secret}' > ~ec2-user/pull-secret.json )

            chown ec2-user:ec2-user ~ec2-user/pull-secret.json
            chmod 600 /tmp/pull-secret.json ~ec2-user/pull-secret.json

            # Every download, upload and extract is checked; any failure signals FAILURE (CF-14).
            wget -q https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${ocp_ver}/openshift-client-linux-amd64-${client_build}-${ocp_ver}.tar.gz || fail "download openshift-client ${client_build} ${ocp_ver}"
            wget -q https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${ocp_ver}/openshift-install-rhel9-amd64.tar.gz || fail "download openshift-install ${ocp_ver}"

            # oc-mirror ships asynchronously from OCP 5.0 (no longer under clients/ocp/<version>/).
            # Saved under the old file name so the registry node's extract step is unchanged.
            wget -q -O oc-mirror.rhel9.tar.gz '${ocm_url}' || fail "download oc-mirror"
            wget -q https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${ocp_ver}/ccoctl-linux-${client_build}-${ocp_ver}.tar.gz || fail "download ccoctl ${client_build} ${ocp_ver}"
            
            wget -q https://developers.redhat.com/content-gateway/file/pub/cgw/mirror-registry/2.0.9/mirror-registry-amd64.tar.gz || fail "download mirror-registry"

            curl -fsS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip" || fail "download AWS CLI"
            unzip -q awscliv2.zip || fail "unzip AWS CLI"
            ./aws/install || fail "install AWS CLI"
            
            for f in openshift-client-linux-amd64-${client_build}-${ocp_ver}.tar.gz openshift-install-rhel9-amd64.tar.gz \
                     oc-mirror.rhel9.tar.gz ccoctl-linux-${client_build}-${ocp_ver}.tar.gz mirror-registry-amd64.tar.gz; do
              /usr/local/bin/aws s3 cp --quiet "$f" "s3://${s3_bucket}/" || fail "upload $f to S3"
            done

            for f in openshift-client-linux-amd64-${client_build}-${ocp_ver}.tar.gz openshift-install-rhel9-amd64.tar.gz \
                     oc-mirror.rhel9.tar.gz ccoctl-linux-${client_build}-${ocp_ver}.tar.gz; do
              tar -xzf "$f" || fail "extract $f"
            done
            rm -f README.md

            sudo mv oc openshift-install-fips kubectl oc-mirror ccoctl /usr/local/bin || fail "install the OpenShift CLIs"
            sudo chown root.root /usr/local/bin/oc /usr/local/bin/kubectl /usr/local/bin/openshift-install-fips /usr/local/bin/oc-mirror /usr/local/bin/ccoctl
            sudo chmod 0755 /usr/local/bin/oc /usr/local/bin/kubectl /usr/local/bin/openshift-install-fips /usr/local/bin/oc-mirror /usr/local/bin/ccoctl
            sudo restorecon -v /usr/local/bin/oc /usr/local/bin/kubectl /usr/local/bin/openshift-install-fips /usr/local/bin/oc-mirror /usr/local/bin/ccoctl
            sudo ln -sf /usr/local/bin/openshift-install-fips /usr/local/bin/openshift-install

            # Signal to the registry node that we're done mirroring to S3
            signal SUCCESS "Configuration Complete"


          - pull_secret: !Ref PullSecretJson
            ocp_ver: !Ref OpenShiftVersion
            client_build: !Ref ClientRhelBuild
            ocm_url: !Ref OcMirrorUrl
            s3_bucket: !Ref S3Bucket
            signal_url: !Ref HelperInstanceWaitHandle

# End Helper/Bastion Node
###########################################################3

  RegistryIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: "Allow"
          Principal:
            Service:
            - "ec2.amazonaws.com"
          Action:
          - "sts:AssumeRole"
      Path: "/"
      Policies:
      - PolicyName: !Join ["-", ["helper", "policy"]]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Effect: "Allow"
            Action: "ec2:Describe*"
            Resource: "*"
          # CF-11: only the staging bucket, only what the user data uses (aws s3 cp/rm).
          - Effect: "Allow"
            Action: "s3:ListBucket"
            Resource: !GetAtt S3Bucket.Arn
          - Effect: "Allow"
            Action: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
            Resource: !Sub "${S3Bucket.Arn}/*"
          # Lets the registry's user data report success or failure to the CreationPolicy on
          # RegistryInstance (CF-14). Limited to this stack.
          - Effect: "Allow"
            Action: "cloudformation:SignalResource"
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  RegistryInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      Path: "/"
      Roles:
      - Ref: "RegistryIamRole"

  RegistryInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows SSH connections to the registry node
      SecurityGroupIngress:
      - CidrIp: !Ref VpcCidr
        FromPort: 22
        ToPort: 22
        IpProtocol: tcp
      - CidrIp: !Ref VpcCidr
        FromPort: 8443 
        ToPort: 8443
        IpProtocol: tcp
      Tags:
      - Key: Name
        Value: !Sub 'Registry SG - ${AWS::StackName}'
      VpcId: !Ref VPC

  RegistryInstance:
    Type: AWS::EC2::Instance
    DependsOn: [HelperInstanceWaitCondition, NATInstance]
    # The stack is not CREATE_COMPLETE until the user data below has installed mirror-registry, Quay
    # answers its health check and ec2-user is logged in (CF-14). Without this the stack completed
    # while the node was still in dnf update.
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT60M
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref ImdsV2LaunchTemplate
        Version: !GetAtt ImdsV2LaunchTemplate.LatestVersionNumber
      ImageId: !If [HasNodeAmi, !Ref NodeAmiId, !FindInMap [RHELMap, !Ref "AWS::Region", HVM64]]
      IamInstanceProfile: !Ref RegistryInstanceProfile
      InstanceType: !Ref RegistryInstanceType
      KeyName: !Ref KeyName
      BlockDeviceMappings:
      - DeviceName: "/dev/sda1"
        Ebs:
          VolumeType: "gp3"
          DeleteOnTermination: "true"
          VolumeSize: "900"
      Tags:
      - Key: Name
        Value: !Sub 'Registry Node - ${AWS::StackName}'
      NetworkInterfaces:
      - AssociatePublicIpAddress: false
        DeviceIndex: "0"
        GroupSet:
        - !Ref RegistryInstanceSG
        SubnetId: !Ref PrivateSubnet
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash -x
            cd /tmp

            # Set the HOME env var missing in systemd
            export HOME="/root"
            export USER="root"

            # Report the result to the CreationPolicy (CF-14). Needs the AWS CLI, which is installed
            # below; a failure before that point ends in the PT60M signal timeout instead.
            signal() {
              /usr/local/bin/aws cloudformation signal-resource --region ${AWS::Region} \
                --stack-name ${AWS::StackName} --logical-resource-id RegistryInstance \
                --unique-id "$(hostname -s)" --status "$1"
            }
            fail() {
              echo "FATAL: $*"
              signal FAILURE
              exit 1
            }

            # Full update, not --security (CF-22: mixed-release SELinux policy breaks podman).
            dnf update -y
            # fapolicyd breaks mirror-registry and other tooling; keep it off for now (AGENTS.md B-5).
            if rpm -q fapolicyd >/dev/null 2>&1; then
              systemctl disable --now fapolicyd || true
              systemctl mask fapolicyd || true
            fi

            # DNF install loop due to slow uptime for NAT gateway
            MAX_ATTEMPTS=10
            attempt_num=1
            until [ $attempt_num -gt $MAX_ATTEMPTS ] || \
                  sudo dnf install -y wget vim podman unzip jq tmux &> /dev/null; do
                
                echo "Attempt $attempt_num failed. Trying again in 10 seconds..."
                sleep 10
                ((attempt_num++))
            done
            
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            ./aws/install
            [ -x /usr/local/bin/aws ] || { echo "FATAL: AWS CLI not installed; cannot signal, stack will time out"; exit 1; }
            [ $attempt_num -le $MAX_ATTEMPTS ] || fail "dnf install of the base packages"

            region=${AWS::Region}

            for f in openshift-client-linux-amd64-${client_build}-${ocp_ver}.tar.gz openshift-install-rhel9-amd64.tar.gz \
                     oc-mirror.rhel9.tar.gz ccoctl-linux-${client_build}-${ocp_ver}.tar.gz mirror-registry-amd64.tar.gz; do
              /usr/local/bin/aws s3 cp --quiet "s3://${s3_bucket}/$f" . || fail "download $f from S3"
              tar -xzf "$f" || fail "extract $f"
            done
            rm -f README.md

            sudo mv oc openshift-install-fips kubectl oc-mirror ccoctl /usr/local/bin || fail "install the OpenShift CLIs"
            sudo chown root.root /usr/local/bin/oc /usr/local/bin/kubectl /usr/local/bin/openshift-install-fips /usr/local/bin/oc-mirror /usr/local/bin/ccoctl
            sudo chmod 0755 /usr/local/bin/oc /usr/local/bin/kubectl /usr/local/bin/openshift-install-fips /usr/local/bin/oc-mirror /usr/local/bin/ccoctl
            sudo restorecon -v /usr/local/bin/oc /usr/local/bin/kubectl /usr/local/bin/openshift-install-fips /usr/local/bin/oc-mirror /usr/local/bin/ccoctl
            sudo ln -sf /usr/local/bin/openshift-install-fips /usr/local/bin/openshift-install

            #sudo fips-mode-setup --enable
            #Don't install mirror-registry until after FIPS is enabled
            mkdir -p /opt/quay-root /opt/quay-root/data /opt/quay-root/sqlite
            # --autoApprove should remove the need for a tty but is not yet supported in the released version
            # The install log holds the generated init password ("credentials (init, <pw>)"). It goes to a
            # root-only file, not to stdout, because user-data output is copied to the EC2 console log.
            # scripts/30-fetch-mirror-credentials.sh reads the password from this file (CF-15).
            ( umask 077; : > /tmp/mirror-registry-install.log )
            ./mirror-registry install --quayRoot /opt/quay-root --quayStorage /opt/quay-root/data --sqliteStorage /opt/quay-root/sqlite \
              > /tmp/mirror-registry-install.log 2>&1
            mr_rc=$?
            sed -E 's/credentials \(init, [^)]*\)/credentials (init, <redacted>)/' /tmp/mirror-registry-install.log
            [ $mr_rc -eq 0 ] || fail "mirror-registry install exited $mr_rc"
            #./mirror-registry install 2>&1 | tee mirror-registry.log # probably should do this as the ec2-user

            # N-9 / PROJQUAY-14321: after a reboot quay-app and quay-redis start before the quay-pod
            # infra container exists ("no pod with name or ID quay-pod found", exit 125) and only
            # recover through the systemd restart timer (~3.5 min outage). Their units already order
            # After=quay-pod.service, but quay-pod is Type=simple, so systemd counts it as started
            # before `podman pod create` finishes (and Type=oneshot is not allowed with its
            # Restart=always). Wait for the pod to exist before starting them.
            for unit in quay-redis quay-app; do
              mkdir -p /etc/systemd/system/$unit.service.d
              printf '%s\n' '[Service]' \
                'ExecStartPre=/usr/bin/timeout 120 /bin/sh -c "until /usr/bin/podman pod exists quay-pod; do sleep 2; done"' \
                > /etc/systemd/system/$unit.service.d/10-wait-for-quay-pod.conf
            done
            systemctl daemon-reload

            cp /opt/quay-root/quay-rootCA/rootCA.pem /etc/pki/ca-trust/source/anchors/quay.pem || fail "Quay root CA not found"
            update-ca-trust
            update-ca-trust extract

            # Quay must answer its health check before the stack is reported complete (CF-14).
            registry_host="$(hostname -f):8443"
            health=000
            for _ in $(seq 1 30); do
              health=$(curl -s -o /dev/null -w '%{http_code}' "https://$registry_host/health/instance")
              [ "$health" = "200" ] && break
              sleep 10
            done
            [ "$health" = "200" ] || fail "Quay health check https://$registry_host/health/instance returned $health"

            # Configure the firewall
            #sudo systemctl enable --now firewalld
            #sudo firewall-cmd --add-port=8443/tcp --zone=internal --permanent
            #sudo firewall-cmd --add-port=8443/tcp --zone=public   --permanent
            #sudo firewall-cmd --add-service=http  --permanent
            #sudo firewall-cmd --reload

            # Log ec2-user in to the registry (docker-format auth file, read by podman and oc-mirror).
            # The old "--password= <host>" passed an empty password and podman then tried to prompt
            # ("inappropriate ioctl for device"). Read the generated password from the install log and
            # pass it on stdin. xtrace is off so the password never reaches the console log (CF-15).
            sudo -u ec2-user mkdir -p -m 700 ~ec2-user/.docker
            set +x
            init_pw=$(sed -n 's/.*credentials (init, \([^)]*\)).*/\1/p' /tmp/mirror-registry-install.log | tail -1)
            if [ -z "$init_pw" ]; then
              set -x
              fail "no 'credentials (init, ...)' line in /tmp/mirror-registry-install.log"
            fi
            printf '%s' "$init_pw" | sudo -u ec2-user podman login --compat-auth-file ~ec2-user/.docker/auth.json \
              --username init --password-stdin "$registry_host"
            login_rc=$?
            unset init_pw
            set -x
            [ $login_rc -eq 0 ] || fail "podman login to $registry_host as init"
            chmod 600 ~ec2-user/.docker/auth.json

            # Configure SELinux to allow containers in systemd services
            #setsebool -P container_manage_cgroup on

            signal SUCCESS

          - ocp_ver: !Ref OpenShiftVersion
            client_build: !Ref ClientRhelBuild
            s3_bucket: !Ref S3Bucket

# End Registry Node
######################################################################################################

Outputs:
  # ---------------------------------------------------------------------------
  # Interface read by scripts/generate-install-config.sh and friends. Keep names stable.
  # ---------------------------------------------------------------------------
  VpcId:
    Description: ID of the new VPC.
    Value: !Ref VPC

  VpcCidr:
    Description: CIDR of the VPC (install-config networking.machineNetwork).
    Value: !GetAtt VPC.CidrBlock

  AvailabilityZone:
    Description: Availability zone of the first subnet pair.
    Value: !GetAtt PrivateSubnet.AvailabilityZone

  AvailabilityZones:
    Description: Comma-separated availability zones of the private subnets, in order.
    Value: !Join
    - ","
    - - !GetAtt PrivateSubnet.AvailabilityZone
      - !If [DoAz2, !GetAtt PrivateSubnet2.AvailabilityZone, !Ref "AWS::NoValue"]
      - !If [DoAz3, !GetAtt PrivateSubnet3.AvailabilityZone, !Ref "AWS::NoValue"]

  PublicSubnetId:
    Description: ID of the first public subnet (Squid instance and bastion).
    Value: !Ref PublicSubnet

  PrivateSubnetId:
    Description: ID of the first private subnet (registry and cluster).
    Value: !Ref PrivateSubnet

  PublicSubnetIds:
    Description: Subnet IDs of the public subnets.
    Value:
      !Join [
        ",",
        [!Ref PublicSubnet, !If [DoAz2, !Ref PublicSubnet2, !Ref "AWS::NoValue"], !If [DoAz3, !Ref PublicSubnet3, !Ref "AWS::NoValue"]]
      ]

  PrivateSubnetIds:
    Description: Subnet IDs of the private subnets.
    Value:
      !Join [
        ",",
        [!Ref PrivateSubnet, !If [DoAz2, !Ref PrivateSubnet2, !Ref "AWS::NoValue"], !If [DoAz3, !Ref PrivateSubnet3, !Ref "AWS::NoValue"]]
      ]

  InstallConfigSubnets:
    Description: >-
      Paste-ready platform.aws.vpc.subnets block for a PRIVATE (publish: Internal) cluster. Only the private
      subnets are listed, and each carries every role a private cluster needs. ControlPlaneExternalLB is
      forbidden when publish is Internal (installer pkg/types/aws/validation/platform.go, release-5.0).
    Value: !If
    - DoAz3
    - !Sub |-
      platform:
        aws:
          region: ${AWS::Region}
          vpc:
            subnets:
            - id: ${PrivateSubnet}
              roles: [{type: ClusterNode}, {type: BootstrapNode}, {type: IngressControllerLB}, {type: ControlPlaneInternalLB}]
            - id: ${PrivateSubnet2}
              roles: [{type: ClusterNode}, {type: BootstrapNode}, {type: IngressControllerLB}, {type: ControlPlaneInternalLB}]
            - id: ${PrivateSubnet3}
              roles: [{type: ClusterNode}, {type: BootstrapNode}, {type: IngressControllerLB}, {type: ControlPlaneInternalLB}]
    - !If
      - DoAz2
      - !Sub |-
        platform:
          aws:
            region: ${AWS::Region}
            vpc:
              subnets:
              - id: ${PrivateSubnet}
                roles: [{type: ClusterNode}, {type: BootstrapNode}, {type: IngressControllerLB}, {type: ControlPlaneInternalLB}]
              - id: ${PrivateSubnet2}
                roles: [{type: ClusterNode}, {type: BootstrapNode}, {type: IngressControllerLB}, {type: ControlPlaneInternalLB}]
      - !Sub |-
        platform:
          aws:
            region: ${AWS::Region}
            vpc:
              subnets:
              - id: ${PrivateSubnet}
                roles: [{type: ClusterNode}, {type: BootstrapNode}, {type: IngressControllerLB}, {type: ControlPlaneInternalLB}]

  BastionPublicIp:
    Description: Public IP of the bastion ("connected side"; SSH as ec2-user).
    Value: !GetAtt HelperInstance.PublicIp

  BastionPublicDnsName:
    Description: Public DNS name of the bastion.
    Value: !GetAtt HelperInstance.PublicDnsName

  RegistryPrivateDnsName:
    Description: >-
      Private DNS name of the mirror-registry node. mirror-registry serves on port 8443 with a certificate
      for this name (it uses hostname -f).
    Value: !GetAtt RegistryInstance.PrivateDnsName

  RegistryPrivateIp:
    Description: Private IP of the mirror-registry node.
    Value: !GetAtt RegistryInstance.PrivateIp

  ProxyPrivateIp:
    Description: Private IP of the Squid NAT / egress-filter instance.
    Value: !GetAtt NATInstance.PrivateIp

  NodeImageId:
    Description: AMI the Squid and registry nodes were launched from.
    Value: !If [HasNodeAmi, !Ref NodeAmiId, !FindInMap [RHELMap, !Ref "AWS::Region", HVM64]]

  BastionImageId:
    Description: AMI the bastion was launched from (records the RHEL major version chosen at creation).
    Value: !If [HasBastionAmi, !Ref BastionAmiId, !FindInMap [RHELMap, !Ref "AWS::Region", HVM64]]

  S3BucketName:
    Description: Staging bucket the bastion uploads tool tarballs to. Must be emptied before the stack can be deleted.
    Value: !Ref S3Bucket
